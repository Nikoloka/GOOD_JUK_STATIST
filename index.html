<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Процент отметки киберспортсмена</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='13' width='24' height='6' rx='3' fill='%23e8b33c'/%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #080a0f;
      background-image: radial-gradient(ellipse 90% 46% at 50% -12%, rgba(232, 179, 60, 0.08), transparent 70%);
      background-attachment: fixed;
      color: #eef2f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lock-card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.028);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 34px 30px 28px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .lock-icon {
      width: 52px; height: 52px;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: rgba(232, 179, 60, 0.12);
      border: 1px solid rgba(232, 179, 60, 0.35);
      display: flex; align-items: center; justify-content: center;
    }
    h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: linear-gradient(120deg, #ffd166, #e8b33c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { font-size: 12.5px; color: #5c6675; margin: 9px 0 22px; line-height: 1.6; }
    input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 6px;
      text-align: center;
      color: #ffd166;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
      font-variant-numeric: tabular-nums;
    }
    input[type="password"]:focus { border-color: rgba(232, 179, 60, 0.6); }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #141005;
      background: linear-gradient(120deg, #ffd166, #e8b33c);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: filter 0.2s, transform 0.15s;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:disabled { opacity: 0.55; cursor: wait; transform: none; }
    .err {
      display: none;
      margin-top: 12px;
      font-size: 12.5px;
      color: #f87171;
      font-weight: 600;
    }
    .note { margin-top: 18px; font-size: 11px; color: #454c58; line-height: 1.6; }
    .spin { display:none; margin-top:12px; font-size:12px; color:#98a2b3; }
  </style>
</head>
<body>
  <div class="lock-card">
    <div class="lock-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffd166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>
    </div>
    <h1>Закрытая страница</h1>
    <div class="sub">Введите пароль доступа</div>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" maxlength="32" placeholder="••••••" />
    <button id="open">Открыть</button>
    <div class="err" id="err">Неверный пароль</div>
    <div class="spin" id="spin">Расшифровка…</div>
    <div class="note">Содержимое зашифровано: без пароля его не видно даже в исходном коде страницы.</div>
  </div>

    const STORE_KEY = 'moe_lock_v1';
    const ITER = 250000;

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function unlock(pin) {
      const blob = b64ToBytes(PAYLOAD_B64);
      const magic = new TextDecoder().decode(blob.slice(0, 8));
      if (magic !== 'Salted__') throw new Error('bad envelope');
      const salt = blob.slice(8, 16);
      const data = blob.slice(16);
      const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, keyMaterial, 384);
      const keyBytes = new Uint8Array(bits);
      const key = await crypto.subtle.importKey('raw', keyBytes.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: keyBytes.slice(32, 48) }, key, data);
      return new TextDecoder().decode(plain);
    }

    function showError() {
      document.getElementById('err').style.display = 'block';
      document.getElementById('spin').style.display = 'none';
      const b = document.getElementById('open');
      b.disabled = false; b.textContent = 'Открыть';
    }

    async function tryPin(pin, remember) {
      if (!pin) return;
      const b = document.getElementById('open');
      b.disabled = true; b.textContent = '…';
      document.getElementById('err').style.display = 'none';
      document.getElementById('spin').style.display = 'block';
      try {
        const html = await unlock(pin);
        if (remember) { try { localStorage.setItem(STORE_KEY, pin); } catch (e) {} }
        document.open(); document.write(html); document.close();
      } catch (e) {
        try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
        showError();
      }
    }

    document.getElementById('open').addEventListener('click', () => tryPin(document.getElementById('pin').value.trim(), true));
    document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') tryPin(e.target.value.trim(), true); });
    document.getElementById('pin').focus();

    // Автовход, если пароль уже вводили на этом устройстве
    try {
      const saved = localStorage.getItem(STORE_KEY);
      if (saved) tryPin(saved, false);
    } catch (e) {}
  </script>
